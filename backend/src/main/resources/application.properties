spring.application.name=lmp_erp
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
#for aws ECs
#SPRING_PROFILES_ACTIVE=prod
spring.datasource.url=jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:lmp_erp}

spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver



server.port=8080

# =====================================
# FRONTEND
# =====================================

app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}

# =====================================
# FILE UPLOAD
# =====================================

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

spring.session.store-type=jdbc

spring.devtools.livereload.enabled=false

# =====================================
# EMAIL CONFIGURATION
# =====================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

mail.from.name=EVA IT Consulting Services

# =====================================
# ADMIN
# =====================================

admin.temp.username=${ADMIN_TEMP_USERNAME:admin}
admin.temp.password=${ADMIN_TEMP_PASSWORD:admin123}

# =====================================
# JWT
# =====================================

jwt.secret=${JWT_SECRET}

#jwt.secret=${JWT_SECRET:EvaERP2026VeryStrongSecretKeyForJWTAuthenticationSystem}

security.cors.allowed-origins=http://localhost:3000,http://localhost:5173
security.jwt.issuer=${spring.application.name:lms_erp}
security.jwt.secret=${JWT_SECRET}

security.jwt.expiration=1d

# =====================================
# ACTUATOR
# =====================================

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# =====================================
# GEOAPIFY
# =====================================

geoapify.api.key=${GEOAPIFY_API_KEY}

#geoapify.api.key=6ea395133ecd423aa6da4247350dc77e
geoapify.base-url=https://api.geoapify.com
