name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - "lms-frontend/**"

# AWS-related config comes from repo Variables (Settings -> Secrets and
# variables -> Actions -> Variables), not hardcoded:
#   PROJECT_NAME          e.g. "lms-erp" - must match the terraform `project` var
#   AWS_REGION             e.g. "us-east-1"
#   AWS_DEPLOY_ROLE_ARN     bootstrap output `github_deploy_role_arn`
env:
  PROJECT_NAME: ${{ vars.PROJECT_NAME || 'lms-erp' }}
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

permissions:
  id-token: write # OIDC
  contents: read

# Unlike the backend, the frontend image is NOT built once and promoted:
# CRA inlines REACT_APP_BACKEND_API_URL at build time (see
# lms-frontend/Dockerfile), and each env's backend lives behind its own ALB
# DNS name - so each env gets its own build, tagged accordingly.
jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: dev
    env:
      TF_ENV: dev
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Look up backend ALB DNS name
        id: backend_url
        run: |
          DNS=$(aws elbv2 describe-load-balancers \
            --names "${PROJECT_NAME}-${TF_ENV}-backend" \
            --query 'LoadBalancers[0].DNSName' --output text)
          echo "value=http://$DNS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        working-directory: lms-frontend
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${PROJECT_NAME}-frontend:${GITHUB_SHA::12}-${TF_ENV}"
          docker build \
            --build-arg REACT_APP_BACKEND_API_URL="${{ steps.backend_url.outputs.value }}" \
            -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${PROJECT_NAME}-${TF_ENV}-frontend \
            --query taskDefinition > task-definition.json

      - id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: frontend
          image: ${{ env.IMAGE }}

      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.PROJECT_NAME }}-${{ env.TF_ENV }}-frontend
          cluster: ${{ env.PROJECT_NAME }}-${{ env.TF_ENV }}
          wait-for-service-stability: true

  deploy-prod:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: prod # GitHub Environment protection rule gates this - configure a required reviewer in repo settings
    env:
      TF_ENV: prod
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Look up backend ALB DNS name
        id: backend_url
        run: |
          DNS=$(aws elbv2 describe-load-balancers \
            --names "${PROJECT_NAME}-${TF_ENV}-backend" \
            --query 'LoadBalancers[0].DNSName' --output text)
          echo "value=http://$DNS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        working-directory: lms-frontend
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${PROJECT_NAME}-frontend:${GITHUB_SHA::12}-${TF_ENV}"
          docker build \
            --build-arg REACT_APP_BACKEND_API_URL="${{ steps.backend_url.outputs.value }}" \
            -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${PROJECT_NAME}-${TF_ENV}-frontend \
            --query taskDefinition > task-definition.json

      - id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: frontend
          image: ${{ env.IMAGE }}

      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.PROJECT_NAME }}-${{ env.TF_ENV }}-frontend
          cluster: ${{ env.PROJECT_NAME }}-${{ env.TF_ENV }}
          wait-for-service-stability: true