<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EvaITCS — Industry Capstone Catalog</title>
<style>
  :root{
    --crimson:#9E1B32; --crimson-d:#7d1526; --navy:#1B2A4A; --navy-l:#2c3f66;
    --gold:#C8A24B; --ink:#181c24; --paper:#f6f4ef; --card:#ffffff;
    --line:#e2ddd3; --muted:#6b6f78; --l1:#3f8f6b; --l2:#c8992f; --l3:#b0442f;
    --mono:'SFMono-Regular',ui-monospace,'Cascadia Code','Consolas',monospace;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --serif:'Fraunces','Georgia',serif;
  }
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit}

  /* Header */
  header{background:var(--navy);color:#fff;padding:0;position:sticky;top:0;z-index:50;border-bottom:3px solid var(--gold)}
  .head-inner{max-width:1180px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .brand{font-family:var(--serif);font-weight:700;font-size:26px;letter-spacing:-.5px;color:#fff}
  .brand .eva{color:var(--gold)}
  .head-sub{font-size:12px;color:#b9c2d6;font-family:var(--mono);text-transform:uppercase;letter-spacing:1.5px;margin-top:2px}
  .head-meta{margin-left:auto;font-size:12px;color:#aeb8cd;font-family:var(--mono);text-align:right;line-height:1.7}
  .head-meta b{color:var(--gold)}

  /* Controls */
  .controls{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:70px;z-index:40}
  .controls-inner{max-width:1180px;margin:0 auto;padding:14px 24px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .search{flex:1;min-width:220px;position:relative}
  .search input{width:100%;padding:11px 14px 11px 38px;border:1.5px solid var(--line);border-radius:9px;font-size:14px;font-family:var(--sans);background:var(--paper)}
  .search input:focus{outline:none;border-color:var(--crimson);background:#fff}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted)}
  .seg{display:flex;border:1.5px solid var(--line);border-radius:9px;overflow:hidden;background:var(--paper)}
  .seg button{border:none;background:none;padding:10px 15px;font-size:12.5px;font-family:var(--mono);cursor:pointer;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;transition:.15s}
  .seg button.on{background:var(--navy);color:#fff}
  .seg button:not(.on):hover{background:#eee7db;color:var(--ink)}
  .count{font-size:12px;font-family:var(--mono);color:var(--muted);white-space:nowrap}

  /* Domain nav */
  .dnav{max-width:1180px;margin:0 auto;padding:20px 24px 6px;display:flex;gap:8px;flex-wrap:wrap}
  .dchip{padding:8px 14px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:8px}
  .dchip:hover{border-color:var(--navy)}
  .dchip.on{background:var(--crimson);color:#fff;border-color:var(--crimson)}
  .dchip .n{font-family:var(--mono);font-size:11px;opacity:.7}

  main{max-width:1180px;margin:0 auto;padding:8px 24px 80px}

  /* Domain section */
  .domain{margin-top:26px}
  .domain-head{display:flex;align-items:baseline;gap:14px;padding-bottom:10px;margin-bottom:20px;border-bottom:2px solid var(--navy);flex-wrap:wrap}
  .domain-head h2{font-family:var(--serif);font-size:27px;font-weight:700;color:var(--navy);letter-spacing:-.4px}
  .domain-head .hire{font-size:12px;color:var(--muted);font-family:var(--mono)}
  .ladder-note{font-size:11px;color:var(--muted);font-family:var(--mono);margin-left:auto;letter-spacing:.5px}

  /* Grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden;display:flex;flex-direction:column;transition:.18s;position:relative}
  .card:hover{border-color:var(--navy);box-shadow:0 8px 26px -14px rgba(27,42,74,.35);transform:translateY(-2px)}
  .card-top{padding:16px 17px 13px;border-bottom:1px dashed var(--line)}
  .lvl-row{display:flex;align-items:center;gap:9px;margin-bottom:10px}
  .lvlbadge{font-family:var(--mono);font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;letter-spacing:.5px;color:#fff}
  .tier{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
  /* difficulty dots */
  .dots{display:flex;gap:3px;margin-left:auto}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--line)}
  .card h3{font-family:var(--serif);font-size:18px;font-weight:600;color:var(--ink);line-height:1.25;margin-bottom:5px}
  .tag{font-size:13px;color:var(--muted)}
  .card-body{padding:15px 17px;flex:1;display:flex;flex-direction:column;gap:13px}
  .sec-label{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--crimson);font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:6px}
  .sec-label::before{content:"";width:12px;height:2px;background:var(--gold)}
  .resp-count{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--navy);background:#eef0f4;border:1px solid var(--line);padding:1px 6px;border-radius:999px;letter-spacing:.3px}
  .sec-label{justify-content:flex-start}
  .scenario{font-size:13.5px;line-height:1.55;color:#333}
  ul.feat{list-style:none;display:flex;flex-direction:column;gap:5px}
  ul.feat li{font-size:12.5px;line-height:1.45;padding-left:15px;position:relative;color:#3a3f48}
  ul.feat li::before{content:"▸";position:absolute;left:0;color:var(--crimson);font-size:11px;top:1px}
  .stack{display:flex;flex-wrap:wrap;gap:5px}
  .chip{font-family:var(--mono);font-size:10.5px;background:var(--paper);border:1px solid var(--line);color:var(--navy);padding:3px 7px;border-radius:5px}
  details.more{border-top:1px dashed var(--line);padding-top:12px;margin-top:2px}
  details.more summary{cursor:pointer;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--navy);font-weight:700;list-style:none;display:flex;align-items:center;gap:7px;user-select:none}
  details.more summary::-webkit-details-marker{display:none}
  details.more summary .arw{transition:.2s;font-size:10px}
  details.more[open] summary .arw{transform:rotate(90deg)}
  .more-body{padding-top:12px;display:flex;flex-direction:column;gap:13px}
  ol.iq{list-style:none;counter-reset:iq;display:flex;flex-direction:column;gap:7px}
  ol.iq li{counter-increment:iq;font-size:12.5px;line-height:1.45;padding-left:24px;position:relative;color:#3a3f48}
  ol.iq li::before{content:counter(iq);position:absolute;left:0;top:0;width:17px;height:17px;background:var(--navy);color:#fff;font-family:var(--mono);font-size:10px;font-weight:700;border-radius:5px;display:flex;align-items:center;justify-content:center}
  .why li::before{content:"✓";color:var(--l1);font-weight:700}
  .why{list-style:none;display:flex;flex-direction:column;gap:5px}
  .why li{font-size:12.5px;line-height:1.45;padding-left:17px;position:relative;color:#3a3f48}
  .why li::before{position:absolute;left:0;top:0}

  .empty{text-align:center;padding:70px 20px;color:var(--muted)}
  .empty h3{font-family:var(--serif);font-size:22px;color:var(--navy);margin-bottom:8px}

  footer{background:var(--navy);color:#c3ccdd;padding:28px 24px;text-align:center;font-size:12px;font-family:var(--mono);line-height:1.9}
  footer b{color:var(--gold)}

  .hide{display:none!important}
  mark{background:var(--gold);color:var(--ink);padding:0 1px;border-radius:2px}

  @media(max-width:640px){
    .controls{top:64px}
    .head-meta{display:none}
    .grid{grid-template-columns:1fr}
    .ladder-note{display:none}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto}}
</style>
</head>
<body>
<header>
  <div class="head-inner">
    <div>
      <div class="brand"><span class="eva">Eva</span>ITCS</div>
      <div class="head-sub">Industry Capstone Catalog</div>
    </div>
    <div class="head-meta">
      <div><b id="total">80</b> projects · <b>8</b> domains</div>
      <div>Enterprise AI Full Stack Java Program</div>
    </div>
  </div>
</header>

<div class="controls">
  <div class="controls-inner">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="text" placeholder="Search projects, tech, or concepts (e.g. idempotency, FHIR, saga, multi-tenant)…" autocomplete="off">
    </div>
    <div class="seg" id="lvlseg">
      <button data-lvl="all" class="on">All levels</button>
      <button data-lvl="beg">Beginner</button>
      <button data-lvl="int">Intermediate</button>
      <button data-lvl="adv">Advanced</button>
    </div>
    <span class="count" id="count"></span>
  </div>
</div>

<nav class="dnav" id="dnav"></nav>
<main id="main"></main>

<footer>
  <div><b>EvaITCS</b> — Eva IT Consulting Services · 3080 Centreville Rd, Suite 208, Herndon, VA</div>
  <div>80 industry projects, laddered beginner → advanced. Build one, then position it with <b>CAN DO / AWARE OF / NOT YET</b>.</div>
</footer>

<script>
// EvaITCS Industry Capstone Catalog — dataset (part 1 of 2)
// Each domain has 10 projects laddered: L1-L2 beginner, L3-L6 intermediate, L7-L10 advanced.
window.EVA_DATA_1 = {"Banking & Financial Services":{"hire":"JPMorgan Chase, Bank of America, Capital One, Goldman Sachs, Wells Fargo, Fannie Mae, Freddie Mac","projects":[{"lvl":1,"name":"TellerLite Account Ledger","tag":"CRUD accounts and a simple transaction ledger.","description":"An internal teller tool that lets branch staff open customer accounts and record deposits and withdrawals. The balance is never edited directly — it is always derived from an immutable ledger of transactions, so the running balance is provably correct and every change is traceable. This is the foundational build that teaches ledger-as-source-of-truth thinking before money moves between accounts.","domain":["Customers own checking/savings accounts with a derived balance.","Every deposit/withdrawal is a transaction row; balance is never edited directly.","Tellers open accounts and post transactions; nothing is hard-deleted.","Roles: TELLER, ADMIN."],"stack":"Spring Boot 3, Spring Data JPA, PostgreSQL, React + TypeScript, REST.","realism":["Ledger-as-source-of-truth (balance derived from transactions).","Money as BigDecimal from day one.","Soft-delete and status fields over destructive edits."],"responsibilities":["Designed and built the relational schema for customers, accounts, and an append-only transaction ledger, choosing correct data types and enforcing referential integrity with foreign keys.","Implemented RESTful CRUD endpoints in Spring Boot to create and search customers and open checking or savings accounts, returning clean and consistent JSON responses.","Developed deposit and withdrawal endpoints that write a new transaction row for every operation instead of mutating a stored balance, preserving a complete audit history.","Enforced business validation on the Spring Boot server so a withdrawal cannot overdraw an account, returning meaningful error messages and correct HTTP status codes on rejection.","Modeled all monetary values using BigDecimal with a fixed scale to eliminate the rounding errors that floating-point types introduce into financial calculations.","Computed each account's running balance by aggregating its transaction ledger, ensuring the displayed balance can never drift from the underlying records.","Added pagination and sorting to the transaction-history endpoint so large accounts return quickly and the interface stays responsive.","Built a React and TypeScript front end with a login screen and a role-aware menu that shows tellers and administrators only the actions permitted for their role."]},{"lvl":1,"name":"CardHolder Registry","tag":"Manage debit/credit cardholders and card status.","description":"A simple registry that issues cards to customers and tracks each card's lifecycle — active, blocked, expired, or replaced. Staff can look up a card, block a lost one, and issue a replacement, with the full status history retained. It introduces lifecycle/status modeling and the idea that sensitive card numbers are masked everywhere except where absolutely required.","domain":["Customers hold cards with a masked number and status.","Card lifecycle: ACTIVE → BLOCKED → EXPIRED → REPLACED.","Status changes are recorded, never overwritten.","Roles: CSR, ADMIN."],"stack":"Spring Boot 3, JPA, PostgreSQL, React + TS, REST.","realism":["Card lifecycle/status modeling.","Masking sensitive card data (PAN) in responses.","History retention over destructive edits."],"responsibilities":["Designed a schema for cardholders and cards with a status field and a separate status-history table so every state change is preserved, using JPA and PostgreSQL.","Implemented endpoints to issue a new card, look up a card by masked number, block a card, and issue a replacement linked to the original.","Built a status lifecycle that permits only valid transitions, rejecting attempts such as blocking an already-expired card with a clear error.","Masked the card primary account number everywhere in API responses, exposing only the last four digits to protect sensitive data.","Recorded who changed a card's status and when, writing a history row rather than overwriting the previous value.","Validated card expiry dates and cardholder details on the Spring Boot server so malformed or expired inputs are rejected before persistence.","Added search and pagination so customer-service reps can find a customer's cards quickly among many records.","Built a React and TypeScript screen for reps to view a customer's cards, see status history, and perform block/replace actions guarded by role."]},{"lvl":1,"name":"BranchLocator Directory","tag":"Branch and ATM directory with hours and services.","description":"A public-facing directory of the bank's branches and ATMs with addresses, hours, and available services, searchable by city or ZIP. It is a clean read-heavy CRUD build that teaches solid REST design, filtering, and pagination on reference data that customers actually browse.","domain":["Branches and ATMs have location, hours, and service tags.","Customers search by city, ZIP, or service.","Admins maintain the directory.","Roles: PUBLIC (read), ADMIN."],"stack":"Spring Boot 3, JPA, PostgreSQL, React + TS, REST.","realism":["Read-optimized reference data with filtering.","Clean REST + pagination.","Public vs admin access separation."],"responsibilities":["Modeled branches and ATMs with structured address, geolocation, operating hours, and a set of service tags, using JPA and PostgreSQL.","Built public read endpoints to search the directory by city, ZIP code, or offered service with sensible defaults.","Implemented filtering and pagination so results return quickly even as the directory grows to hundreds of locations.","Created admin-only endpoints to add, edit, and deactivate locations, separating public read access from privileged writes.","Validated operating-hours and address inputs server-side to keep the published directory accurate and consistent.","Added a soft-delete/active flag so closed branches disappear from public results without losing historical records.","Designed the REST responses to be cache-friendly for the read-heavy public traffic pattern.","Built a responsive React and TypeScript directory with search filters and a location detail view showing hours and services."]},{"lvl":1,"name":"BeneficiaryBook","tag":"Manage saved payees/beneficiaries for a customer.","description":"A personal address book of trusted payees a customer can pay later — each with a nickname, masked account number, and validation of routing details. It teaches per-user data ownership, input validation of financial identifiers, and safe masking, forming a building block reused across payments features.","domain":["Customers own a list of beneficiaries.","Each beneficiary has nickname, masked account, routing number.","Beneficiaries are validated and can be deactivated.","Roles: CUSTOMER."],"stack":"Spring Boot 3, JPA, PostgreSQL, React + TS, REST.","realism":["Per-user data ownership and isolation.","Validation of routing/account identifiers.","Masking stored financial identifiers."],"responsibilities":["Designed a beneficiary schema scoped to each customer so one user can never see or edit another user's payees, using JPA and PostgreSQL.","Implemented add, edit, list, and deactivate endpoints with server-side validation of account and routing numbers.","Applied a checksum-style validation to routing numbers to reject obviously invalid entries before saving.","Masked stored account numbers in all responses, showing only the last few digits alongside the nickname.","Enforced ownership checks on every read and write so requests can only touch the authenticated customer's beneficiaries.","Added duplicate detection so the same account is not saved twice under different nicknames.","Implemented soft-deactivation so removed payees are hidden but retained for any historical references.","Built a React and TypeScript beneficiary manager with inline validation feedback and clear masking of sensitive fields."]},{"lvl":1,"name":"InterestPost Daily Accrual","tag":"Post simple daily interest to savings accounts.","description":"A scheduled job that calculates and posts simple daily interest to savings accounts based on their balance and a configured annual rate. It introduces scheduled processing, careful money math with correct rounding, and idempotent posting so a re-run never double-credits interest.","domain":["Savings accounts accrue interest at a configured annual rate.","A daily job posts interest as a ledger transaction.","Posting is idempotent per day.","Roles: SYSTEM, ADMIN."],"stack":"Spring Boot 3, Spring Scheduling, JPA, PostgreSQL, React + TS.","realism":["Scheduled jobs and money math.","Correct rounding of interest.","Idempotent posting to prevent double credit."],"responsibilities":["Designed the interest calculation to derive a daily rate from the configured annual rate and apply it to the account's balance using BigDecimal.","Implemented a scheduled daily job that iterates eligible savings accounts and posts an interest transaction to each.","Made posting idempotent by keying interest on the account and accrual date so a re-run of the job never credits the same day twice.","Applied a defined rounding policy (half-even) so fractions-of-a-cent are handled consistently and auditable.","Recorded each interest posting as a normal ledger transaction, keeping the derived-balance model intact.","Added configuration for the annual rate so it can be changed without code, with the effective rate captured on each posting.","Wrote validation and logging so a failed account does not abort the entire batch and can be safely retried.","Built an admin screen to view interest postings per account and confirm the job ran for a given date."]},{"lvl":1,"name":"StatementView Reader","tag":"Read-only monthly statement viewer.","description":"A customer-facing viewer that assembles a read-only monthly statement from an account's transactions, showing opening balance, itemized activity, and closing balance for a chosen period. It teaches period-based aggregation, running-balance computation, and clean date-range querying.","domain":["A statement lists transactions for an account and period.","Opening/closing balances bracket the activity.","Statements are read-only views, not stored documents.","Roles: CUSTOMER."],"stack":"Spring Boot 3, JPA, PostgreSQL, React + TS.","realism":["Period aggregation and running balance.","Date-range querying.","Read-only projection over the ledger."],"responsibilities":["Implemented a statement endpoint that accepts an account and a month and returns opening balance, transactions, and closing balance.","Computed the opening balance as the sum of all transactions before the period start, and the closing balance from the period activity.","Rendered a per-line running balance so the customer can follow how each transaction moved the account.","Handled date-range boundaries carefully, including timezone considerations, so transactions land in the correct statement period.","Enforced ownership so a customer can only view statements for their own accounts.","Added pagination for high-volume accounts while preserving the running-balance continuity across pages.","Optimized the query with appropriate indexes so statement generation stays fast on large ledgers.","Built a React and TypeScript statement view with period selection and a clean, printable layout."]},{"lvl":1,"name":"KYC Onboarding Form","tag":"Capture and validate new-customer KYC details.","description":"A structured onboarding form that captures the identity information a bank needs to open an account — name, date of birth, address, and identification — with thorough server-side validation and a status of pending until reviewed. It introduces KYC vocabulary, strong validation, and a simple review status.","domain":["Applicants submit identity details for KYC.","Submissions validate and enter a PENDING state.","Staff mark records verified or rejected.","Roles: APPLICANT, ONBOARDING_STAFF."],"stack":"Spring Boot 3, JPA, PostgreSQL, React + TS.","realism":["KYC data capture and validation.","Status lifecycle (pending/verified/rejected).","Server-authoritative validation."],"responsibilities":["Designed a KYC schema capturing legal name, date of birth, address, and identification document details, using JPA and PostgreSQL.","Implemented strong server-side validation for each field, including date-of-birth sanity and identification format checks.","Placed each new submission into a PENDING status awaiting staff review rather than auto-approving.","Built staff endpoints to mark a submission verified or rejected with a captured reason.","Recorded the reviewer and timestamp for each decision to support an auditable onboarding trail.","Prevented duplicate applications for the same identity with a uniqueness check and a clear message.","Separated applicant and staff permissions so applicants can only submit and view their own record.","Built an accessible React onboarding form with clear inline validation and a status indicator."]},{"lvl":1,"name":"FeeSchedule Manager","tag":"Maintain a catalog of account fees.","description":"A reference catalog of account fees — monthly maintenance, overdraft, wire, and more — with amounts, effective dates, and descriptions that other systems can look up. It teaches effective-dated reference data and clean admin CRUD on figures that must be accurate and versioned over time.","domain":["Fees have a code, amount, description, and effective date.","Fees can be superseded by a new effective-dated version.","Other features look up the current fee.","Roles: PRODUCT_ADMIN, STAFF (read)."],"stack":"Spring Boot 3, JPA, PostgreSQL, React + TS.","realism":["Effective-dated reference data.","Versioning of monetary figures.","Config-as-data lookup for other features."],"responsibilities":["Modeled fees with a stable code, a BigDecimal amount, a description, and an effective date to support versioning over time.","Implemented a lookup that returns the fee in effect for a given code and date, enabling other features to price accurately.","Built admin endpoints to create a new effective-dated version of a fee rather than overwriting the previous amount.","Retained superseded fee versions so historical charges can always be explained against the rate that applied then.","Validated amounts and effective dates on the Spring Boot server to prevent overlapping or contradictory fee records.","Restricted write access to product administrators while allowing staff read-only lookups.","Added search and filtering so administrators can quickly find and compare fee versions.","Built a React and TypeScript admin screen to manage fees and preview which version is currently in effect."]},{"lvl":1,"name":"ChequeBook Requester","tag":"Order and track chequebook requests.","description":"A small service that lets customers request a chequebook for an eligible account and tracks the request through requested, printed, and dispatched states. It reinforces status-lifecycle modeling and eligibility checks against account type.","domain":["Customers request chequebooks for eligible accounts.","Requests move REQUESTED → PRINTED → DISPATCHED.","Only checking-type accounts are eligible.","Roles: CUSTOMER, OPS."],"stack":"Spring Boot 3, JPA, PostgreSQL, React + TS.","realism":["Eligibility rules by account type.","Fulfilment status lifecycle.","Ownership-scoped requests."],"responsibilities":["Implemented a request endpoint that first checks the target account is an eligible checking account before accepting the order.","Modeled the fulfilment lifecycle with valid transitions from requested to printed to dispatched, using JPA and PostgreSQL.","Scoped requests to the authenticated customer so users only see and create their own chequebook orders.","Built operations endpoints to advance a request's status and record dispatch details.","Recorded a timestamped history of each status change for traceability.","Validated request quantity and account eligibility on the Spring Boot server, rejecting invalid orders clearly.","Added listing and filtering so operations staff can process pending requests efficiently.","Built a React and TypeScript screen for customers to place a request and track its progress."]},{"lvl":1,"name":"AlertPrefs Center","tag":"Manage customer notification preferences.","description":"A preferences center where customers choose which account alerts they receive (low balance, large debit, statement ready) and through which channel. It teaches per-user preference modeling and clean toggling of settings that downstream notification systems will read.","domain":["Customers set alert types and channels (email/SMS).","Preferences are per-customer and per-alert-type.","Downstream systems read these preferences.","Roles: CUSTOMER."],"stack":"Spring Boot 3, JPA, PostgreSQL, React + TS.","realism":["Per-user preference modeling.","Channel and type toggles.","Config other systems consume."],"responsibilities":["Designed a preferences model keyed by customer and alert type, each with an enabled flag and a chosen channel.","Implemented endpoints to read and update a customer's alert preferences with validation of allowed channels.","Provided sensible defaults so new customers start with recommended alerts enabled.","Enforced ownership so customers can only view and change their own preferences.","Exposed a clean read endpoint downstream notification systems can query to decide whether and how to notify.","Validated that at least contact details exist for a chosen channel before enabling it.","Recorded when preferences were last changed to aid support and troubleshooting.","Built a React and TypeScript preferences screen with grouped toggles and channel selection."]},{"lvl":1,"name":"ForexBoard Rates","tag":"Display and admin-manage FX reference rates.","description":"A reference board of foreign-exchange rates the bank publishes, with an admin surface to update rates and a public read surface for customers. It teaches effective-timestamped reference data and a simple conversion helper.","domain":["Currency pairs have buy/sell rates with a timestamp.","Admins update rates; customers read them.","A helper converts an amount between currencies.","Roles: PUBLIC (read), RATES_ADMIN."],"stack":"Spring Boot 3, JPA, PostgreSQL, React + TS.","realism":["Timestamped reference rates.","Buy/sell spread modeling.","Conversion math with rounding."],"responsibilities":["Modeled currency pairs with buy and sell rates and an as-of timestamp for each published update, using JPA and PostgreSQL.","Built admin endpoints to publish new rates, retaining prior values for historical reference.","Implemented a public read endpoint returning current rates for display to customers.","Added a conversion helper that applies the correct buy or sell rate and rounds results consistently.","Validated rate inputs so sell is never below buy and values are positive.","Restricted updates to a rates-admin role while keeping reads public.","Indexed lookups by currency pair so rate reads are fast under heavy display traffic.","Built a React and TypeScript rate board with a small converter widget for customers."]},{"lvl":1,"name":"OverdraftLimit Setter","tag":"Set and view per-account overdraft limits.","description":"A tool for staff to assign an approved overdraft limit to eligible accounts and for the ledger to respect that limit when validating withdrawals. It connects reference configuration to real transaction validation in a simple, understandable way.","domain":["Accounts may have an approved overdraft limit.","Withdrawals are validated against balance plus limit.","Limit changes are audited.","Roles: STAFF, CUSTOMER (read)."],"stack":"Spring Boot 3, JPA, PostgreSQL, React + TS.","realism":["Config feeding transaction validation.","Balance-plus-limit checks.","Audit of limit changes."],"responsibilities":["Added an overdraft-limit field to acc ["Note CRUD + validation.","Version history.","Soft-delete + restore.","Pagination."],"stack":"Spring Boot 3, JPA, PostgreSQL, React + TS.","realism":["Clean REST + versioning is table stakes at big tech.","Soft-delete.","Pagination."],"interview":["How do you design clean REST resources?","How do you model version history efficiently?","Why soft-delete?","How do you paginate consistently?"]},{"lvl":3,"name":"RateLimiter Token Bucket","tag":"Per-client rate limiting with correct 429s.","scenario":"You build a reusable rate limiter (token bucket) applied per client, returning proper 429s and headers under burst.","domain":["Each client has a token bucket.","Requests consume tokens; refill over time.","Over-limit → 429 + retry headers.","Roles: any API client."],"features":["Token-bucket algorithm.","Per-client keys.","429 + Retry-After headers.","Burst handling."],"stack":"Spring Boot 3, Redis, React + TS (demo dashboard).","realism":["Rate limiting is a favorite big-tech task.","Token bucket.","Correct HTTP semantics."],"interview":["Implement token bucket — how does refill work?","How does it behave under burst?","Why 429 + Retry-After?","How do you make it distributed (Redis)?"]},{"lvl":4,"name":"FollowGraph Social Graph","tag":"Follow/unfollow with efficient graph queries.","scenario":"You build the social graph: follow/unfollow, followers/following lists, and mutual-follow queries at scale.","domain":["Directed follow edges between users.","Follower/following queries paginated.","Mutual/relationship checks.","Roles: USER, MODERATOR."],"features":["Follow/unfollow.","Followers/following (cursor-paginated).","Mutual-follow check.","Counts."],"stack":"Spring Boot 3, JPA, PostgreSQL, React + TS.","realism":["Graph modeling + pagination at scale.","Edge storage.","Cursor pagination."],"interview":["How do you store a follow graph relationally?","How do you paginate huge follower lists?","How do you compute mutuals efficiently?","How do you keep counts accurate?"]},{"lvl":5,"name":"FeedGen Timeline Service","tag":"Personalized feed: fan-out on read vs write.","scenario":"You build the feed: merge posts from followed users into a ranked timeline, choosing (and defending) fan-out-on-read vs fan-out-on-write.","domain":["A feed merges followed users' posts.","Fan-out strategy chosen deliberately.","Ranking orders the timeline.","Roles: USER."],"features":["Feed endpoint (cursor-paginated).","Fan-out strategy implementation.","Simple ranking.","Cache hot feeds."],"stack":"Spring Boot 3, JPA, PostgreSQL, Redis, React + TS.","realism":["Fan-out is the canonical feed system-design topic.","Strategy tradeoffs.","Caching."],"interview":["Fan-out on read vs write — tradeoffs and your pick?","How do you handle a celebrity with millions of followers?","How do you cache and invalidate feeds?","How do you rank the timeline?"]},{"lvl":6,"name":"SearchIndex Inverted Index","tag":"Build a simple full-text search service.","scenario":"You build a search service with your own inverted index: tokenize, index documents, and rank results by relevance.","domain":["Documents tokenize into an inverted index.","Queries match + rank (TF-IDF-ish).","Index updates on new docs.","Roles: USER, ADMIN."],"features":["Tokenization + inverted index.","Ranked query results.","Incremental indexing.","Highlight snippets."],"stack":"Spring Boot 3, JPA, PostgreSQL, React + TS.","realism":["Building search internals shows real depth.","Inverted index.","Relevance ranking."],"interview":["How does an inverted index work?","How do you rank by relevance simply?","How do you update the index incrementally?","Where would you switch to Elasticsearch and why?"]},{"lvl":7,"name":"NotifyHub Notification Pipeline","tag":"Async multi-channel notifications with retries.","scenario":"You build notifications: events fan out to channels (in-app, email, push) via a queue, with retries, dedup, and user preferences.","domain":["Events produce notifications per user prefs.","Async delivery via queue with retries.","Dedup prevents duplicate sends.","Roles: USER, ADMIN."],"features":["Event→notification fan-out.","Async queue + retry/backoff.","Dedup + preferences.","Delivery status."],"stack":"Spring Boot 3, Kafka (or queue), JPA, PostgreSQL, React + TS.","realism":["Async pipelines + retries are core big-tech infra.","Queue + backoff.","Dedup."],"interview":["How do you avoid sending duplicate notifications?","How do retries + backoff work?","How do you respect user preferences?","How do you scale delivery?"]},{"lvl":8,"name":"FlagServe Feature Flags","tag":"Feature-flag service with targeting + rollout.","scenario":"You build a feature-flag platform: define flags, target by user/segment, do percentage rollouts, and evaluate fast.","domain":["Flags have targeting rules + rollout %.","Evaluation is fast + cached.","Changes are audited.","Roles: DEVELOPER, ADMIN."],"features":["Flag CRUD + targeting rules.","Percentage rollout (sticky).","Fast cached evaluation.","Change audit."],"stack":"Spring Boot 3, JPA, PostgreSQL, Redis, React + TS.","realism":["Feature flags are ubiquitous platform infra.","Targeting + sticky rollout.","Fast eval + cache."],"interview":["How do you make percentage rollout sticky per user?","How do you evaluate flags fast?","How do you target by segment?","How do you audit flag changes safely?"]},{"lvl":9,"name":"MetricsPipe Observability Backend","tag":"Ingest, aggregate, and query time-series metrics.","scenario":"You build a metrics backend: ingest time-series data, aggregate into rollups, and serve queries for dashboards with retention policies.","domain":["Metrics ingest as time-series points.","Rollups (1m/1h) precompute aggregates.","Queries serve dashboards; retention prunes.","Roles: DEVELOPER, SRE."],"features":["Time-series ingestion.","Rollup aggregation.","Range query API.","Retention/downsampling."],"stack":"Spring Boot 3, JPA, PostgreSQL (time-series), React + TS + charts.","realism":["Observability backends are serious platform work.","Time-series rollups.","Retention/downsampling."],"interview":["How do you store time-series efficiently?","Why precompute rollups?","How do you serve range queries fast?","How do retention + downsampling work?"]},{"lvl":10,"name":"PulseFeed Scalable Content Platform","tag":"Scale-minded content platform (capstone).","scenario":"The capstone judges the way big tech does: posts, graph, ranked feed with fan-out, token-bucket rate limiting, caching with invalidation, observability, and a real test suite — clean API and correct-at-scale behavior.","domain":["Posts + follow graph + ranked feed.","Rate limiting + caching + invalidation.","Observability + tests throughout.","Roles: USER, MODERATOR, ADMIN."],"features":["Post/follow/feed with fan-out.","Token-bucket rate limiting.","Cache + invalidation on new posts.","Health, metrics, and a real test suite."],"stack":"Spring Boot 3, JPA, PostgreSQL, Redis, React + TS. Heavy testing.","realism":["A scale-shaped platform — the big-tech résumé centerpiece.","System-design instincts throughout.","Testing + observability that pass the bar."],"interview":["Walk your whole design — where are the scale bottlenecks?","Fan-out + cache invalidation together — how?","How does rate limiting behave under burst?","What does your test suite actually prove?"]}]}};
window.EVA_DATA_2 = {};

</script>
<script>
const DATA = Object.assign({}, window.EVA_DATA_1, window.EVA_DATA_2);
const DOMAINS = Object.keys(DATA);
const shortName = {
  "Banking & Financial Services":"Banking","Consulting Companies":"Consulting",
  "Federal Contract Companies":"Federal","Telecom":"Telecom","Healthcare":"Healthcare",
  "Insurance":"Insurance","Retail & E-commerce":"Retail","Tech Giants":"Tech Giants"
};
function tierOf(l){ return l<=2?'beg':(l<=6?'int':'adv'); }
function tierLabel(l){ return l<=2?'Beginner':(l<=6?'Intermediate':'Advanced'); }
function lvlColor(l){ return l<=2?'var(--l1)':(l<=6?'var(--l2)':'var(--l3)'); }

let activeDomain = 'all';
let activeLvl = 'all';
let query = '';

// total count
let total=0; DOMAINS.forEach(d=>total+=DATA[d].projects.length);
document.getElementById('total').textContent=total;

// domain nav
const dnav=document.getElementById('dnav');
const allChip=document.createElement('div');
allChip.className='dchip on';allChip.dataset.d='all';
allChip.innerHTML=`All domains <span class="n">${total}</span>`;
dnav.appendChild(allChip);
DOMAINS.forEach(d=>{
  const c=document.createElement('div');
  c.className='dchip';c.dataset.d=d;
  c.innerHTML=`${shortName[d]} <span class="n">${DATA[d].projects.length}</span>`;
  dnav.appendChild(c);
});
dnav.addEventListener('click',e=>{
  const chip=e.target.closest('.dchip'); if(!chip)return;
  activeDomain=chip.dataset.d;
  [...dnav.children].forEach(x=>x.classList.toggle('on',x===chip));
  render();
});

// level segment
document.getElementById('lvlseg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  activeLvl=b.dataset.lvl;
  [...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b));
  render();
});

// search
let t;
document.getElementById('q').addEventListener('input',e=>{
  clearTimeout(t); t=setTimeout(()=>{query=e.target.value.trim().toLowerCase();render();},140);
});

function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function hl(s){
  s=esc(s);
  if(!query)return s;
  try{const re=new RegExp('('+query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');return s.replace(re,'<mark>$1</mark>');}catch(e){return s;}
}
function matches(p){
  if(activeLvl!=='all' && tierOf(p.lvl)!==activeLvl) return false;
  if(!query) return true;
  const parts=[p.name,p.tag,p.scenario||p.description||'',p.stack].concat(p.domain||[],p.features||[],p.responsibilities||[],p.realism||[],p.interview||[]);
  const hay=parts.join(' ').toLowerCase();
  return hay.includes(query);
}

function dots(l){
  let h='<div class="dots" title="Difficulty '+l+'/10">';
  for(let i=1;i<=10;i++){h+=`<span class="dot" style="${i<=l?'background:'+lvlColor(l):''}"></span>`;}
  return h+'</div>';
}

function card(p,domain){
  const c=lvlColor(p.lvl);
  const overview = p.description || p.scenario || '';
  const hasResp = Array.isArray(p.responsibilities) && p.responsibilities.length;
  // Primary "what you'll do" block: responsibilities (new) or features (old)
  const doLabel = hasResp ? 'Role &amp; responsibilities' : "What you'll build";
  const doItems = hasResp ? p.responsibilities : (p.features||[]);
  const respCount = hasResp ? `<span class="resp-count">${p.responsibilities.length} points</span>` : '';
  // Extra sections in the dropdown
  let extra = '';
  if(p.domain&&p.domain.length){
    extra += `<div><div class="sec-label">The domain</div><ul class="feat">${p.domain.map(f=>`<li>${hl(f)}</li>`).join('')}</ul></div>`;
  }
  if(p.realism&&p.realism.length){
    extra += `<div><div class="sec-label">Why it feels like the real job</div><ul class="why">${p.realism.map(f=>`<li>${hl(f)}</li>`).join('')}</ul></div>`;
  }
  if(p.interview&&p.interview.length){
    extra += `<div><div class="sec-label">Interview questions you'll be ready for</div><ol class="iq">${p.interview.map(f=>`<li>${hl(f)}</li>`).join('')}</ol></div>`;
  }
  return `<article class="card">
    <div class="card-top">
      <div class="lvl-row">
        <span class="lvlbadge" style="background:${c}">L${p.lvl}</span>
        <span class="tier">${tierLabel(p.lvl)}</span>
        ${dots(p.lvl)}
      </div>
      <h3>${hl(p.name)}</h3>
      <div class="tag">${hl(p.tag)}</div>
    </div>
    <div class="card-body">
      <div>
        <div class="sec-label">${p.description?'What this project does':'Your scenario'}</div>
        <div class="scenario">${hl(overview)}</div>
      </div>
      <div>
        <div class="sec-label">${doLabel} ${respCount}</div>
        <ul class="feat">${doItems.map(f=>`<li>${hl(f)}</li>`).join('')}</ul>
      </div>
      <div>
        <div class="sec-label">Stack</div>
        <div class="stack">${p.stack.replace(/\.$/,'').split(/,\s*/).map(s=>`<span class="chip">${esc(s)}</span>`).join('')}</div>
      </div>
      ${extra?`<details class="more">
        <summary><span class="arw">▶</span> Domain &amp; why it's real${p.interview?' &amp; interview prep':''}</summary>
        <div class="more-body">${extra}</div>
      </details>`:''}
    </div>
  </article>`;
}

function render(){
  const main=document.getElementById('main');
  const doms = activeDomain==='all'?DOMAINS:[activeDomain];
  let html='';let shown=0;
  doms.forEach(d=>{
    const ps=DATA[d].projects.filter(matches).sort((a,b)=>a.lvl-b.lvl);
    if(!ps.length)return;
    shown+=ps.length;
    html+=`<section class="domain">
      <div class="domain-head">
        <h2>${shortName[d]}</h2>
        <span class="hire">Hires from here: ${esc(DATA[d].hire)}</span>
        <span class="ladder-note">L1–L2 beginner · L3–L6 intermediate · L7–L10 advanced</span>
      </div>
      <div class="grid">${ps.map(p=>card(p,d)).join('')}</div>
    </section>`;
  });
  if(!shown){
    html=`<div class="empty"><h3>No projects match that.</h3><p>Try a broader term, or clear the search to see all ${total} projects.</p></div>`;
  }
  main.innerHTML=html;
  document.getElementById('count').textContent=shown+' shown';
}
render();
</script>
</body>
</html>
